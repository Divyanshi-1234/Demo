<html>
    <head>
        <tittle>Grid</tittle>
        <style>
            *{
                margin:0;
                padding:0;
                box-sizing:border-box;
            }
            .contain{
                
                display:grid;
                border:2px solid red;
                grid-template-columns:100px 200px 300px;
                grid-template-rows:100px 80px;
                

            }
            .a{ 
                border:2px solid blue;
                
              
            }
        </style>
    </head>
    <body>
        <container class="contain">
            <div class="a"> Box 1</div>
            <div class="a"> Box 2</div>
            <div class="a">Box 3</div>
             <div class="a">Box 4</div>
              <div class="a">Box 5</div>
               <div class="a">Box 6</div>
                 <div class="a">Box 7</div>
                  <div class="a">Box 8</div>
                   <div class="a">Box 9</div>
                    <div class="a">Box 10</div>
                     
        </container>
    </body>
</html>
