<html>
    <head>
        <tittle>Gradient</tittle>
        <style>
            div{
                background-color:blue;
                height:100px;
                width:100px;
                margin:5px;
            }
            #a{

                background:Linear-gradient(to right,red,yellow);
               
            }
            #b{
             background:radial-gradient(ellipse,blue,red,pink);
            }
            #c{
                background:conic-gradient(red,pink,yellow,green);
            }
        </style>
    </head>
    <body>
        <div>
            <div id="a">Linear gradient
            </div>
            <div id="b">Radial gradient</div>
            <div id="c">conic-gradient</div>

        </div>
    </body>
</html>
