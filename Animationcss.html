<html>
    <head>
        <tittle>Animation</tittle>
    </head>
    <style>
         div{
            background-color:blue;
            height:200px;
            width:300px;
            animation-name:ani;
            animation-duration:2s;
            animation-direction:reverse;
            animation-delay:3s;
         }
         @keyframes ani{
            from{
                background-color:red; 
            }
            to{
                background-color:yellow;
    } }
        
    </style>
    <body>
        <div>
            <div>Box1</div>
        </div>
    </body>
</html>
